<!doctype html>
<html><head><meta charset="utf-8"><title>AirPod Wipeout</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  html,body{margin:0;height:100%;background:#05060f;overflow:hidden;font-family:ui-monospace,Menlo,monospace;color:#9ff}
  canvas{display:block}
  #hud{position:fixed;inset:0;pointer-events:none;text-shadow:0 0 8px #0ff}
  #top{position:absolute;top:12px;left:16px;right:16px;display:flex;justify-content:space-between;font-size:18px}
  #status{position:absolute;bottom:12px;left:16px;font-size:13px;opacity:.85;line-height:1.5}
  #gesture{position:absolute;top:45%;width:100%;text-align:center;font-size:56px;font-weight:700;color:#f0f;opacity:0;transition:opacity .35s}
  #msg{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(5,6,15,.78);font-size:20px;text-align:center;line-height:1.7}
  #msg h1{font-size:44px;margin:0 0 12px;color:#0ff;letter-spacing:4px}
  #metrics{position:absolute;top:44px;left:16px;font-size:14px;opacity:.9}
  #msum{margin-top:18px;font-size:16px;line-height:1.6;border-top:1px solid #0ff4;padding-top:10px}
  #rival{position:absolute;top:44px;left:50%;transform:translateX(-50%);font-size:15px;text-align:center;line-height:1.5;text-shadow:0 0 8px #f0f}
  #pad{position:absolute;bottom:14px;right:16px;width:84px;height:84px;border:2px solid #0ff;border-radius:50%;box-shadow:0 0 10px #0ff4}
  #pad::before,#pad::after{content:'';position:absolute;background:#0ff4}
  #pad::before{left:50%;top:0;bottom:0;width:1px}#pad::after{top:50%;left:0;right:0;height:1px}
  #dot{position:absolute;width:14px;height:14px;margin:-7px;border-radius:50%;background:#f0f;left:50%;top:50%;box-shadow:0 0 8px #f0f}
  .bar{display:inline-block;width:120px;height:8px;background:#123;vertical-align:middle;position:relative}
  .bar i{position:absolute;top:0;bottom:0;width:6px;background:#0ff;left:57px}
  #debug{position:absolute;top:44px;right:16px;pointer-events:auto;background:rgba(5,6,15,.85);border:1px solid #0ff6;padding:8px 10px;font-size:12px;line-height:1.9}
  #debug b{color:#0ff;letter-spacing:2px}
  #debug input[type=range]{width:110px;vertical-align:middle;accent-color:#f0f}
  #debug button{font:inherit;color:#9ff;background:#123;border:1px solid #0ff6;cursor:pointer}
  #joy,#xy{display:block;margin-top:6px;background:#020310;border:1px solid #0ff3}
</style></head>
<body>
<div id="hud">
  <div id="top"><span id="speed">0 km/h</span><span id="shield">SHIELD ▮▮▮</span><span id="dist">0 m</span></div>
  <div id="rival"></div>
  <div id="gesture"></div>
  <div id="status"></div>
  <div id="pad"><i id="dot"></i></div>
  <div id="msg"></div>
  <div id="debug">
    <b>DEBUG</b> <small>(` to close)</small><br>
    <label><input type="checkbox" id="dbgJoy"> Joystick view</label><br>
    Dead zone <input type="range" id="dbgDead" min="0" max="0.5" step="0.01"> <span id="dbgDeadVal"></span><br>
    Sensitivity <input type="range" id="dbgSens" min="0.4" max="2.5" step="0.1"> <span id="dbgSensVal"></span><br>
    <button id="dbgCenter">Recenter neutral (C)</button>
    <canvas id="joy" width="240" height="240"></canvas>
    <b>JUMP / X·Y MOTION</b><br>
    <label><input type="checkbox" id="dbgPhys"> Physical jump (lift)</label>
    <label><input type="checkbox" id="dbgLiftFlip"> invert</label><br>
    Lift needed <input type="range" id="dbgLift" min="0.02" max="0.20" step="0.005"> <span id="dbgLiftVal"></span><br>
    <button id="dbgRec">● Record X/Y</button> <span id="dbgRecInfo"></span>
    <canvas id="xy" width="240" height="130"></canvas>
  </div>
</div>
<script src="three.min.js"></script>
<script src="input.js"></script>
<script src="game.js"></script>
<script src="debug.js"></script>
<script src="metrics.js"></script>
</body></html>
