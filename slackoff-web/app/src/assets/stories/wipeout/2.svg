@keyframes waves { to { transform: translateX(-120px); } }
.cyl { animation: slide 2.6s ease-in-out infinite alternate; } .c1 { animation-duration: 2.1s; animation-direction: alternate-reverse; } .c2 { animation-duration: 3s; }
@keyframes slide { from { transform: translateX(-110px); } to { transform: translateX(110px); } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
