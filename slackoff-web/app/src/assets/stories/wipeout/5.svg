<style>
.drift { animation: drift 40s ease-in-out infinite alternate; }
.waves { animation: waves 6s linear infinite; }
@keyframes drift { to { transform: translateX(-60px); } }
@keyframes waves { to { transform: translateX(-120px); } }
.bell { transform-box: view-box; transform-origin: 800px 412px; animation: ring 1.6s ease-in-out infinite; }
@keyframes ring { 0%, 100% { transform: rotate(0); } 20% { transform: rotate(12deg); } 45% { transform: rotate(-10deg); } 65% { transform: rotate(6deg); } 85% { transform: rotate(-3deg); } }
.conf { animation: float 3s ease-in-out infinite alternate; } @keyframes float { to { transform: translateY(10px); } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
