<defs>
<linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#a9d6e0"/><stop offset="1" stop-color="#d4ebee"/></linearGradient>
<linearGradient id="water" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6fcbe8"/><stop offset="1" stop-color="#2f8fc4"/></linearGradient>
