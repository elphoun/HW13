<pattern id="stripes" width="60" height="60" patternUnits="userSpaceOnUse" patternTransform="rotate(-30)"><rect width="60" height="60" fill="#f2c14e"/><rect width="30" height="60" fill="#e8403a"/></pattern>
</defs>
<style>
.drift { animation: drift 40s ease-in-out infinite alternate; }
.waves { animation: waves 6s linear infinite; }
@keyframes drift { to { transform: translateX(-60px); } }
@keyframes waves { to { transform: translateX(-120px); } }
.arm { transform-box: view-box; transform-origin: 800px 587px; animation: sweep 3.2s ease-in-out infinite alternate; }
@keyframes sweep { from { transform: scaleX(1); } to { transform: scaleX(-1); } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
