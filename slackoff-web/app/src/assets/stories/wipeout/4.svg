@keyframes waves { to { transform: translateX(-120px); } }
.bridge { transform-box: view-box; transform-origin: 800px 600px; animation: wobble 2.4s ease-in-out infinite; }
@keyframes wobble { 25% { transform: rotate(1.6deg) translateY(6px); } 75% { transform: rotate(-1.6deg) translateY(-4px); } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
